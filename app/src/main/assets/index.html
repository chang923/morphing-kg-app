<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>变构飞行器知识图谱</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif;background:#0b1020;color:#eef2ff}header{position:sticky;top:0;background:#111827cc;backdrop-filter:blur(8px);z-index:10;padding:14px 16px;border-bottom:1px solid #2d3748}h1{margin:0;font-size:22px}.sub{font-size:12px;color:#a5b4fc;margin-top:6px}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 12px;background:#0f172a;position:sticky;top:72px;z-index:9}.tab{border:1px solid #334155;border-radius:999px;padding:9px 12px;color:#dbeafe;background:#172554;white-space:nowrap}.tab.active{background:#2563eb}.wrap{padding:14px;max-width:1100px;margin:auto}.card{background:#111827;border:1px solid #243244;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 8px 24px #0004}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#0f172a;border-radius:14px;padding:12px}.metric b{display:block;font-size:24px;margin-top:6px;color:#fff}.muted{color:#94a3b8;font-size:13px}input,select,button,textarea{width:100%;padding:11px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px}button{background:#2563eb;border:0;font-weight:700;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{display:inline-block;background:#1e293b;color:#bfdbfe;padding:4px 8px;border-radius:999px;margin:3px;font-size:12px}.item{border-bottom:1px solid #243244;padding:10px 0}.item:last-child{border-bottom:0}.path{font-size:14px;line-height:1.8;background:#0f172a;border-radius:12px;padding:10px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid #243244;padding:8px;text-align:left;vertical-align:top}.scroll{overflow:auto}.bar{height:10px;background:#334155;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#60a5fa}.hidden{display:none}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}h1{font-size:30px}.tabs{top:82px}.wrap{padding:22px}.card{padding:20px}}@media(max-width:420px){.row{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.tabs{top:72px}.tab{font-size:13px;padding:8px 10px}}
</style>
</head>
<body>
<header><h1>✈️ 变构飞行器知识图谱</h1><div class="sub">手机 APK 版：内置默认数据，支持导入 CSV、实体查询、关系检索、路径分析和算法评估</div></header>
<nav class="tabs" id="tabs"></nav>
<main class="wrap">
<section id="page-home" class="page"></section>
<section id="page-import" class="page hidden"></section>
<section id="page-entity" class="page hidden"></section>
<section id="page-relation" class="page hidden"></section>
<section id="page-path" class="page hidden"></section>
<section id="page-algo" class="page hidden"></section>
<section id="page-about" class="page hidden"></section>
</main>
<script>
const tabs=[['home','图谱总览'],['import','导入CSV'],['entity','实体查询'],['relation','关系检索'],['path','路径分析'],['algo','算法评估'],['about','说明']];
let entities=[], relations=[], graph=new Map(), rev=new Map();
const E_NAME='标准实体名称', E_TYPE='实体类型', R_HEAD='头实体标准名', R_TAIL='尾实体标准名', R_TYPE='关系类型', R_CONF='置信度';
function $(id){return document.getElementById(id)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);if(!rows.length)return[];let head=rows[0].map(x=>x.trim());return rows.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])))}
async function loadDefault(){let [e,r]=await Promise.all([fetch('entities_canonical.csv').then(x=>x.text()),fetch('relations_canonical.csv').then(x=>x.text())]);entities=parseCSV(e);relations=parseCSV(r);build();renderAll()}
function build(){graph=new Map();rev=new Map();relations.forEach(r=>{let h=r[R_HEAD],t=r[R_TAIL];if(!h||!t)return;if(!graph.has(h))graph.set(h,[]);graph.get(h).push(r);if(!rev.has(t))rev.set(t,[]);rev.get(t).push(r)});}
function counts(arr,key){let m={};arr.forEach(x=>{let k=x[key]||'未分类';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function metric(label,val){return `<div class="metric"><span class="muted">${label}</span><b>${val}</b></div>`}
function topBars(data){let max=Math.max(1,...data.map(x=>x[1]));return data.slice(0,8).map(([k,v])=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:8px"><span>${escapeHtml(k)}</span><b>${v}</b></div><div class="bar"><span style="width:${v/max*100}%"></span></div></div>`).join('')}
function table(rows,cols,n=50){return `<div class="scroll"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,n).map(r=>`<tr>${cols.map(c=>`<td>${escapeHtml(r[c]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderHome(){let nodeSet=new Set();relations.forEach(r=>{if(r[R_HEAD])nodeSet.add(r[R_HEAD]);if(r[R_TAIL])nodeSet.add(r[R_TAIL])});$('page-home').innerHTML=`<div class="card"><h2>总体统计</h2><div class="grid">${metric('实体数',entities.length)}${metric('关系数',relations.length)}${metric('图中节点数',nodeSet.size)}${metric('关系类型数',counts(relations,R_TYPE).length)}</div></div><div class="row"><div class="card"><h3>实体类型分布</h3>${topBars(counts(entities,E_TYPE))}</div><div class="card"><h3>关系类型分布</h3>${topBars(counts(relations,R_TYPE))}</div></div>`}
function renderImport(){ $('page-import').innerHTML=`<div class="card"><h2>导入 CSV</h2><p class="muted">可以使用内置默认数据，也可以上传你自己的实体 CSV 和关系 CSV。字段建议沿用：标准实体名称、实体类型、头实体标准名、关系类型、尾实体标准名。</p><button onclick="loadDefault()">恢复内置默认数据</button></div><div class="card"><h3>上传实体 CSV + 关系 CSV</h3><label class="muted">实体 CSV</label><input type="file" id="efile" accept=".csv"><br><br><label class="muted">关系 CSV</label><input type="file" id="rfile" accept=".csv"><button onclick="importPair()">导入两个 CSV</button></div><div class="card"><h3>上传三元组单表 CSV</h3><p class="muted">支持列名：head,relation,tail 或 头实体标准名,关系类型,尾实体标准名。</p><input type="file" id="tfile" accept=".csv"><button onclick="importTriple()">导入三元组 CSV</button></div><div class="card"><h3>当前数据</h3><div class="grid">${metric('实体数',entities.length)}${metric('关系数',relations.length)}${metric('关系类型数',counts(relations,R_TYPE).length)}${metric('实体类型数',counts(entities,E_TYPE).length)}</div></div>`}
function readFile(f){return new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsText(f,'utf-8')})}
async function importPair(){let ef=$('efile').files[0],rf=$('rfile').files[0];if(!ef||!rf){alert('请同时选择实体 CSV 和关系 CSV');return}entities=parseCSV(await readFile(ef));relations=parseCSV(await readFile(rf));build();renderAll();alert('导入成功')}
async function importTriple(){let f=$('tfile').files[0];if(!f){alert('请选择三元组 CSV');return}let rows=parseCSV(await readFile(f));relations=rows.map((x,i)=>({[R_HEAD]:x[R_HEAD]||x.head||x.头实体||x.subject||'',[R_TYPE]:x[R_TYPE]||x.relation||x.predicate||'相关',[R_TAIL]:x[R_TAIL]||x.tail||x.尾实体||x.object||'',[R_CONF]:x[R_CONF]||x.confidence||''})).filter(x=>x[R_HEAD]&&x[R_TAIL]);let names=new Set();relations.forEach(r=>{names.add(r[R_HEAD]);names.add(r[R_TAIL])});entities=[...names].map((n,i)=>({[E_NAME]:n,[E_TYPE]:'导入实体'}));build();renderAll();alert('导入成功')}
function renderEntity(){let sample=entities.slice(0,30).map(e=>`<span class="pill" onclick="searchEntity('${String(e[E_NAME]).replace(/'/g,"\\'")}')">${escapeHtml(e[E_NAME])}</span>`).join('');$('page-entity').innerHTML=`<div class="card"><h2>实体查询</h2><input id="entityKw" placeholder="输入实体名，例如：变构飞行器、折叠翼、气动性能"><button onclick="searchEntity()">查询</button><div style="margin-top:10px">${sample}</div></div><div id="entityOut" class="card"><span class="muted">请输入实体名进行查询。</span></div>`}
function searchEntity(v){let kw=v||$('entityKw').value.trim();if(v)$('entityKw').value=v;if(!kw)return;let es=entities.filter(e=>String(e[E_NAME]).includes(kw)||String(e['别名集合']||'').includes(kw));let rs=relations.filter(r=>String(r[R_HEAD]).includes(kw)||String(r[R_TAIL]).includes(kw));$('entityOut').innerHTML=`<h3>查询结果：${escapeHtml(kw)}</h3><p class="muted">匹配实体 ${es.length} 个，相关关系 ${rs.length} 条。</p><h4>实体</h4>${table(es,[E_NAME,E_TYPE,'定义或备注'],10)}<h4>相关三元组</h4>${table(rs,[R_HEAD,R_TYPE,R_TAIL,R_CONF,'证据句'],30)}`}
function renderRelation(){let opts=['全部',...counts(relations,R_TYPE).map(x=>x[0])].map(x=>`<option>${escapeHtml(x)}</option>`).join('');$('page-relation').innerHTML=`<div class="card"><h2>关系检索</h2><div class="row"><input id="relKw" placeholder="关键词：实体名/证据句"><select id="relType">${opts}</select></div><button onclick="searchRelation()">检索</button></div><div id="relOut" class="card"><span class="muted">输入关键词或选择关系类型。</span></div>`}
function searchRelation(){let kw=$('relKw').value.trim(),tp=$('relType').value;let rs=relations.filter(r=>(tp==='全部'||r[R_TYPE]===tp)&&(!kw||Object.values(r).some(v=>String(v).includes(kw))));$('relOut').innerHTML=`<h3>关系结果</h3><p class="muted">共 ${rs.length} 条，最多展示 100 条。</p>${table(rs,[R_HEAD,R_TYPE,R_TAIL,R_CONF,'证据句'],100)}`}
function neighbors(n){let arr=[];(graph.get(n)||[]).forEach(r=>arr.push([r[R_TAIL],r]));(rev.get(n)||[]).forEach(r=>arr.push([r[R_HEAD],r]));return arr}
function bfs(a,b){let q=[[a,[]]],seen=new Set([a]);while(q.length){let [n,p]=q.shift();if(n===b)return p;for(let [nx,r] of neighbors(n)){if(!seen.has(nx)){seen.add(nx);q.push([nx,p.concat([[n,r[R_TYPE],nx]])]);if(p.length>5)return null}}}return null}
function renderPath(){let names=entities.slice(0,80).map(e=>`<option value="${escapeHtml(e[E_NAME])}">`).join('');$('page-path').innerHTML=`<datalist id="names">${names}</datalist><div class="card"><h2>路径分析</h2><div class="row"><input id="start" list="names" placeholder="起点实体"><input id="end" list="names" placeholder="终点实体"></div><button onclick="findPath()">查找最短路径</button></div><div id="pathOut" class="card"><span class="muted">输入两个实体后查询。</span></div>`}
function findPath(){let a=$('start').value.trim(),b=$('end').value.trim();let p=bfs(a,b);if(!a||!b)return;if(!p){$('pathOut').innerHTML=`<h3>未找到路径</h3><p class="muted">可以换成图谱中更常见的实体名。</p>`;return}$('pathOut').innerHTML=`<h3>最短路径</h3><div class="path">${p.map(x=>`${escapeHtml(x[0])} <b>—${escapeHtml(x[1])}→</b> ${escapeHtml(x[2])}`).join('<br>')}</div>`}
function degreeScores(){let m={};relations.forEach(r=>{m[r[R_HEAD]]=(m[r[R_HEAD]]||0)+1;m[r[R_TAIL]]=(m[r[R_TAIL]]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function renderAlgo(){let deg=degreeScores();$('page-algo').innerHTML=`<div class="card"><h2>算法评估</h2><p class="muted">手机端内置轻量分析：度中心性用于发现图谱中的核心概念；完整 PageRank 可在电脑 Streamlit 版运行。</p><div class="grid">${metric('节点数',deg.length)}${metric('边数',relations.length)}${metric('最高度数',deg[0]?.[1]||0)}${metric('关系类型数',counts(relations,R_TYPE).length)}</div></div><div class="card"><h3>核心概念 Top 20</h3>${deg.slice(0,20).map(([k,v])=>`<div class="item"><b>${escapeHtml(k)}</b><span class="pill">度数 ${v}</span></div>`).join('')}</div>`}
function renderAbout(){ $('page-about').innerHTML=`<div class="card"><h2>应用说明</h2><p>本 APK 是变构飞行器知识图谱的手机展示版，适合课堂展示和答辩演示。系统内置原始变构飞行器实体关系数据，也支持在手机上导入新的 CSV 数据。</p><p>推荐演示顺序：图谱总览 → 实体查询 → 关系检索 → 路径分析 → 数据导入。</p><p class="muted">说明：该 APK 为离线前端应用，不依赖 Python 和 Streamlit；如需大型图谱可视化和完整算法，请使用电脑端 Streamlit 版本。</p></div>`}
function renderAll(){renderHome();renderImport();renderEntity();renderRelation();renderPath();renderAlgo();renderAbout()}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));$('page-'+id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));$('tab-'+id).classList.add('active')}
function initTabs(){ $('tabs').innerHTML=tabs.map(([id,name])=>`<button class="tab" id="tab-${id}" onclick="show('${id}')">${name}</button>`).join('');show('home')}
initTabs();loadDefault();
</script>
</body>
</html>
